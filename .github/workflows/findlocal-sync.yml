name: Find Local Sync

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findlocal-production-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize Find Local events
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FINDLOCAL_API_KEY: ${{ secrets.FINDLOCAL_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required credentials
        run: |
          test -n "$FINDLOCAL_API_KEY"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Synchronize events
        run: node scripts/findlocal-scheduled-runner.mjs
